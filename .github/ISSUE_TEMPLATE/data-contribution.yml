name: Data contribution
description: Offer a public dataset that addresses an open gap. Becomes a `data` cycle under the supplier's name; every cycle run on it credits you.
title: "Data: <gap> in <mission>"
labels: ["data"]
body:
  - type: input
    id: mission
    attributes:
      label: Mission repository and gap id
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Supplier, as they want to be named
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Institution (optional)
  - type: input
    id: endpoint
    attributes:
      label: Public endpoint
      description: The URL where the dataset can be fetched. It must be public; the cycle records this link, its provenance and your terms.
    validations:
      required: true
  - type: input
    id: licence
    attributes:
      label: Licence or data-use terms
    validations:
      required: true
  - type: textarea
    id: dataset
    attributes:
      label: Dataset
      description: Instrument, quantity, cadence, coverage dates, format, size, how it was processed before arrival
    validations:
      required: true
  - type: textarea
    id: first_use
    attributes:
      label: What will be done with it first
      description: Written before anyone looks at the values. This becomes the cycle's rule.
