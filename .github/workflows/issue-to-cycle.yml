# Reusable: a mission repository calls this on `issues: [opened, edited]`. For an issue labelled read, rerun or data,
# it writes cycles/<kind>-issue-<n>.yaml from the form answers, verbatim, and opens a pull request under the
# submitter's handle for a maintainer to merge after validation. A form that cannot be read (for a read: an empty or
# malformed checklist, an unknown trace commit, an item the trace does not have) writes nothing; the submitter is
# told what to change, and editing the issue runs this again.
name: DEBRIEF issue to cycle
on:
  workflow_call:
    inputs:
      protocol_ref:
        type: string
        default: main
      ledger:
        description: path to the mission's ledger.json; the generated cycle is merged into it and validated here
        type: string
        default: ledger/ledger.json
jobs:
  cycle:
    if: contains(github.event.issue.labels.*.name, 'read') || contains(github.event.issue.labels.*.name, 'rerun') || contains(github.event.issue.labels.*.name, 'data')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Nervous-Machine/DEBRIEF
          ref: ${{ inputs.protocol_ref }}
          path: .debrief-protocol
      - name: Work out the kind
        id: kind
        run: |
          labels='${{ join(github.event.issue.labels.*.name, ',') }}'
          for k in read rerun data; do case ",$labels," in *",$k,"*) echo "kind=$k" >> "$GITHUB_OUTPUT";; esac; done
      - name: Write the cycle file from the form
        id: write
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > /tmp/issue_body.md
          rc=0
          python3 .debrief-protocol/tools/issue_to_cycle.py --kind "${{ steps.kind.outputs.kind }}" --issue "${{ github.event.issue.number }}" \
            --author "${{ github.event.issue.user.login }}" --body /tmp/issue_body.md --out cycles --repo . > /tmp/issue_to_cycle.out || rc=$?
          cat /tmp/issue_to_cycle.out
          if [ "$rc" = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = 2 ]; then echo "ok=false" >> "$GITHUB_OUTPUT"
          else exit "$rc"; fi
      - name: Validate the ledger with the new cycle merged
        if: steps.write.outputs.ok == 'true'
        id: validate
        run: |
          python3 -m pip install --quiet jsonschema pyyaml
          rc=0
          { python3 .debrief-protocol/tools/merge_cycles.py "${{ inputs.ledger }}" cycles --out /tmp/merged.json \
            && python3 .debrief-protocol/tools/validate.py /tmp/merged.json --repo . ; } > /tmp/validate.out 2>&1 || rc=$?
          cat /tmp/validate.out
          if [ "$rc" = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Tell the submitter the cycle did not validate
        if: steps.write.outputs.ok == 'true' && steps.validate.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const out = require('fs').readFileSync('/tmp/validate.out', 'utf8').trim();
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "Thank you. Your answers were written as a cycle file, but the ledger did not validate with it merged, so no pull request was opened:\n\n```\n" + out + "\n```\n\nA maintainer will look at this; editing the issue runs the check again." })
      - name: Tell the submitter what to change
        if: steps.write.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const problems = require('fs').readFileSync('/tmp/issue_to_cycle.out', 'utf8').trim().split('\n').map(l => '- ' + l).join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "Thank you. This form could not be recorded yet, so nothing has entered the ledger:\n\n" + problems + "\n\nEdit the issue to correct it and it will be read again." })
      - name: Open a pull request
        if: steps.write.outputs.ok == 'true' && steps.validate.outputs.ok == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: cycle/issue-${{ github.event.issue.number }}
          title: "${{ steps.kind.outputs.kind }} cycle from #${{ github.event.issue.number }} by @${{ github.event.issue.user.login }}"
          body: |
            Generated from issue #${{ github.event.issue.number }}, answers copied verbatim. Closes #${{ github.event.issue.number }} when merged.
            The ledger validated with this cycle merged (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            A maintainer fills in `gap_ids` if the form did not name the gap, and merges. Nothing in the content is edited.
            The check on this pull request itself waits for a maintainer's "Approve and run", because a workflow opened it.
          commit-message: "Cycle from issue #${{ github.event.issue.number }} (${{ steps.kind.outputs.kind }}) by ${{ github.event.issue.user.login }}"
          add-paths: cycles/
      - name: Tell the submitter
        if: steps.write.outputs.ok == 'true' && steps.validate.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "Thank you. Your answers are now a cycle file in a pull request, under your handle, copied verbatim, and the ledger validates with it merged. A maintainer will merge it, and your name enters the ledger and the next release's author list." })
