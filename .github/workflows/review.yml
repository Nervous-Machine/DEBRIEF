# Reusable workflow: the automated second review of meaning (tools/semantic_review.py). A mission repository calls it
# on its daily schedule. It runs only when a review is due (none yet, or the inputs changed) and only when the
# ANTHROPIC_API_KEY secret is available (an organisation secret, passed with `secrets: inherit`). It commits the
# pre-registration first and the review second, on one branch, and opens a pull request for a maintainer to merge.
name: DEBRIEF second review of meaning
on:
  workflow_call:
    inputs:
      ledger:
        type: string
        default: ledger/ledger.json
      protocol_ref:
        type: string
        default: main
      model:
        type: string
        default: claude-opus-5-5
    secrets:
      ANTHROPIC_API_KEY:
        required: false
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Nervous-Machine/DEBRIEF
          ref: ${{ inputs.protocol_ref }}
          path: .debrief-protocol
      - run: python3 -m pip install --quiet anthropic jsonschema pyyaml
      - name: Is a review due?
        id: due
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_KEY" != true ]; then echo "no ANTHROPIC_API_KEY secret; skipping"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh pr list --head review/second-review --state open --json number -q '.[0].number' | grep -q .; then echo "a review pull request is already open"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=$( [ "$(python3 .debrief-protocol/tools/semantic_review.py needed --repo . --ledger '${{ inputs.ledger }}')" = yes ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - name: Pre-register, then review, as two commits
        if: steps.due.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b review/second-review
          python3 .debrief-protocol/tools/semantic_review.py prereg --repo . --ledger "${{ inputs.ledger }}" --model "${{ inputs.model }}"
          git add prereg_review.yaml prereg_review.yaml.sha256
          git commit -m "Pre-register the automated second review of meaning (${{ inputs.model }}), before it runs"
          python3 .debrief-protocol/tools/semantic_review.py review --repo . --ledger "${{ inputs.ledger }}" --summary /tmp/review.md
          python3 .debrief-protocol/tools/render.py "${{ inputs.ledger }}" --scorecard SCORECARD.md
          python3 .debrief-protocol/tools/render.py "${{ inputs.ledger }}" --asks ASKS.md
          python3 .debrief-protocol/tools/validate.py "${{ inputs.ledger }}" --repo .
          git add trace/ "${{ inputs.ledger }}" SCORECARD.md ASKS.md
          git commit -m "Automated second review of meaning (${{ inputs.model }})"
          git push --force -u origin review/second-review
          gh pr create --head review/second-review --title "Second review of meaning ($(date -u +%F))" --body-file /tmp/review.md
