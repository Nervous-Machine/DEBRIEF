name: erdos306
label: "Erdős #306"
title: "The claimed solution of Erdős Problem #306 (sums of unit fractions with semiprime denominators)"
area: "Number theory: unit fractions"
rests_on: "an arXiv paper and a Lean development, built on an earlier conditional Lean development by another author"
short_version: >-
  Erdős and Graham asked whether every positive rational with squarefree denominator is a sum of distinct unit fractions
  whose denominators are products of two distinct primes. In September 2026 Shisheng Li listed a claimed full proof with
  an arXiv paper and a Lean development, building on a June 2026 Lean development by Yuren Tang that proved the result
  conditional on two stated axioms. A third-party formalisation of the problem statement exists, so part of the semantic
  check can be done by machine. Nobody independent has reported building the Lean development or reading the paper.
problem:
  url: https://www.erdosproblems.com/306
  posed: "Erdős and Graham (1980)"
  plain: >-
    Take any positive rational a/b whose denominator b is squarefree. Can a/b always be written as a sum of distinct unit
    fractions 1/n, each n the product of two distinct primes? The case of three distinct primes with b = 1 was settled by
    Butler, Erdős and Graham in 2015; many explicit decompositions of 1 are known.
  formal_statement: {repo: google-deepmind/formal-conjectures, path: FormalConjectures/ErdosProblems/306.lean, commit: e028240a61822d970c933f4656f51da025cf200b, blob_sha: f7940968a96f001791760ef405089a19056c013b, size: 2656}
claims:
  - by: "Shisheng Li"
    ai: "GPT-5.6-sol, GPT-6-astra, Claude Opus 5.5 (as listed by the claimant)"
    submitted: "2026-09-29"
    where: https://www.erdosproblems.com/forum/thread/306/proof-claims
    summary_plain: >-
      The claim is a full solution: every a/b with b squarefree is a finite sum of distinct 1/(pq) with p and q distinct
      primes. After reducing to small targets it uses one complete bipartite graph between a set of small primes and a tuned
      set of larger primes, counts subgraphs with the right reciprocal sum modulo one by a finite Fourier sum, and needs only
      Chebyshev-type bounds on primes. The author reports a Lean formalisation with no sorry and standard axioms only, which
      also proves the third-party formal-conjectures statement, and notes that version 1 of the arXiv paper still says the
      formalisation assumed Ramanujan's inequality while the repository now proves the needed bound.
    notes_plain: >-
      The author describes the argument as using Yuren Tang's circle-method framework with a different construction. Tang's
      own Lean development, deposited on Zenodo, gave a proof conditional on two Rosser–Schoenfeld-type axioms; the Erdős
      wiki listed it as a candidate full solution with Lean on June 19, 2026.
    artifacts:
      - {kind: arxiv, id: 2609.32140v1, title: "Unit fractions with semiprime denominators: an elementary proof of Erdős Problem #306", published: "2026-09-26", updated: "2026-09-26"}
      - {kind: repo, repo: daizisheng/erdos-306, commit: 1314c9a8bcedaaf986f61fb6cd7129a834116abb, commit_date: "2026-09-29T01:13:03Z", license: null, lean_files: 14, lakefile: false}
      - {kind: arxiv, id: 2606.15159v2, title: "Every natural number is a sum of distinct semiprime unit fractions (earlier partial result by the same author)", published: "2026-06-13", updated: "2026-06-17"}
      - {kind: zenodo, url: "https://doi.org/10.5281/zenodo.20767390 (Yuren Tang's Lean development, conditional on two stated axioms; cited by the claimant)"}
