    spoken: "The problem asks for a reasonable function. The claim fixes what reasonable means, dyadic regularity, and resolves that version in both directions. Whether that captures what the authors meant is a judgment for a number theorist, and it is separate from whether the proofs are correct."
    what: "a number theorist reads the problem's source and the claim's definition and says, under their name, whether the resolved statement is the problem"
