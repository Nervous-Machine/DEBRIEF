name: erdos731
label: "Erdős #731"
title: "The claimed solution of Erdős Problem #731 (the least non-divisor of the central binomial coefficient)"
area: "Number theory: binomial coefficients"
rests_on: "an arXiv paper and a Lean development, under the claimant's own formalisation of the word 'reasonable'"
short_version: >-
  Erdős, Graham, Ruzsa and Straus asked for a reasonable function f(n) such that, for almost all n, the least m not
  dividing the central binomial coefficient is asymptotic to f(n). In June 2026 Eric Li posted a paper, and in July a Lean
  development, resolving the problem under an explicit dyadic-regularity reading of 'reasonable': a best deterministic
  scale exists for tightness in density, and no dyadically regular f gives the asymptotic equivalence asked for. Whether
  that reading answers the problem as posed is a judgment a number theorist has to make. Everything here is open.
problem:
  url: https://www.erdosproblems.com/731
  posed: "Erdős, Graham, Ruzsa and Straus (1975)"
  plain: >-
    For an integer n let A(n) be the least m that does not divide the central binomial coefficient (2n choose n). The
    authors say it is not hard to show that for almost all n, A(n) is exp((log n)^(1/2 + o(1))). The problem asks for a
    reasonable function f(n) with A(n) asymptotic to f(n) for almost all n.
  formal_statement: {repo: google-deepmind/formal-conjectures, path: FormalConjectures/ErdosProblems/731.lean, commit: e028240a61822d970c933f4656f51da025cf200b, blob_sha: 1ca01c40151c0b9dd8c440437ab8b7663b34ad83, size: 3538}
claims:
  - by: "Eric Li"
    ai: "GPT-5.5 Pro (as listed by the claimant)"
    submitted: "2026-07-17"
    where: https://www.erdosproblems.com/forum/thread/731/proof-claims
    summary_plain: >-
      The claim resolves the problem under an explicit dyadic-regularity formalisation of 'reasonable'. On each dyadic block
      it gives a scale F and proves two-sided tail bounds in natural density around it, so that log A(n) minus the main terms
      is tight in density, while no dyadically regular deterministic scale satisfies the requested asymptotic equivalence. The
      author presents this as a two-part answer: F is the best possible deterministic scale, and the equivalence as literally
      asked cannot hold for any dyadically regular f.
    artifacts:
      - {kind: arxiv, id: 2606.29062v2, title: "A Resolution of Erdős Problem 731 under Dyadic Regularity", published: "2026-06-27", updated: "2026-07-26"}
      - {kind: repo, repo: ericlisg/erdos731, commit: cb1b58c88bf639bb87664dd96ffc327c305e160e, commit_date: "2026-07-26T01:54:23Z", license: Apache-2.0, lean_files: 130, lakefile: true}
