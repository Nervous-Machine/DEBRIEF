claims_heading: Claims
claims_lede: >-
  One row per claim, most recent activity first. A machine check says the formal statements follow from the axioms; a
  human read says whether those statements are the problem as posed. Checks by others are credited as dated cycles in
  each claim's ledger whether sent here or published elsewhere. Stages are defined in the
  <a href="https://github.com/Nervous-Machine/DEBRIEF/blob/main/schema/SCHEMA.md">protocol</a>; engineering use, where
  marked, is our assessment, argued in <a href="https://github.com/Nervous-Machine/DEBRIEF/blob/main/APPLICATIONS.md">APPLICATIONS.md</a>.
col_claim: claim
col_stage: stage
col_machine: checked by machine
col_human: read by a person
