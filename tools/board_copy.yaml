# The words on the claims board (docs/index.html). Edit here, then run `sh tools/regen.sh` and commit.
# Plain text; links may be written as HTML <a href="...">...</a>. Table contents come from the ledgers, not from here.
# Delete a line, or leave it blank, and that element disappears from the page. Optional eyebrows: map_eyebrow, claims_eyebrow.

title: DEBRIEF Claims Board
meta_description: "Crowd Sourced Checking of Mathematical Claims"
brand: DEBRIEF · Claims Board
byline: by Nervous Machine · generated {generated} from the mission ledgers


map_heading: Claims by Classification

legend_dashed: checked by the maintainer only
legend_solid: checked by someone else too

claims_heading: Individual claims and contributions
claims_lede: >-
  One row per claim. Machines have checked several of these proofs; no person has yet signed for what any of the
  statements mean. Checks by others are credited as dated cycles in each claim's ledger, whether they were sent here
  (Fredrik Prüzelius's rerun) or published elsewhere (the <a href="https://palomar-registry.org/about">Palomar registry</a>,
  which replays proofs through independent kernels and has a language model judge the statement; Linmiao Xu's port of #306).
  DeepMind <a href="https://github.com/google-deepmind/formal-conjectures">formal-conjectures</a> and erdosproblems.com statuses
  were read on 17 Nov 2026. Stages are defined in the <a href="https://github.com/Nervous-Machine/DEBRIEF/blob/main/schema/SCHEMA.md">protocol</a>;
  engineering use is our assessment, argued in <a href="https://github.com/Nervous-Machine/DEBRIEF/blob/main/APPLICATIONS.md">APPLICATIONS.md</a>.
col_claim: claim
col_stage: stage
col_proof: proof checked by
col_elsewhere: elsewhere
col_meaning: what it means
col_use: engineering use
col_needs: what it needs next
no_contributions: no contributions
be_first: be the first →
and_more: and {n} more →
what_would_close: What would close it →
leave_reasoning: leave your reasoning →

