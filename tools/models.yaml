# Public release dates and access tiers of the models that claims on the board name. Read by tools/tooling.py to say
# whether a model was public when the work was done. Dates come from the vendor's own announcement page unless the
# note says otherwise; a day known only from Wikipedia is marked. Tiers are as named at release. Checked 2026-11-22.
#
# Tier words used across the register, lowest access first:
#   none             no model used (stated by the claimant)
#   free             a free consumer tier
#   subscription     a paid consumer tier at the lower price (Plus, Pro at $20, Max; the claimant's statement decides)
#   subscription-pro the top consumer tier (ChatGPT Pro at $200, Claude Max 20x and similar), where the claimant names
#                    a Pro-only model or the tier
#   api              programmatic access billed by token, including agent harnesses (Codex, Claude Code) on API keys
#   internal         a lab's own models or unlimited internal access, as an employee or partner
#   mixed            more than one of the above, named in the basis
#   unknown          the claimant does not say and the record cannot infer it
models:
  - id: claude-fable-5-2
    name: Claude Fable 5.2
    vendor: Anthropic
    public_release: "2026-11-09"
    tiers_at_release: [api, subscription, subscription-pro]
    source: https://www.anthropic.com/claude-fable-and-mythos-5-2
    note: "API on all platforms the same day; included on paid consumer plans with weekly-limit shares. No preview program named."
